name: Keep Render Server Alive

on:
  schedule:
    - cron: '0,14,28,42,56 * * * *'  # Every ~14 minutes
  workflow_dispatch:          # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          echo "Pinging server at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" https://your-app.onrender.com)
          echo "Response code: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 400 ]; then
            echo "✅ Server is up!"
          else
            echo "⚠️ Server returned: $response"
          fi
